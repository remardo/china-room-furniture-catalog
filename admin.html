<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>China Room — заявки закупщика</title>
<style>
:root{--paper:#f3efe6;--ink:#182119;--muted:#687068;--line:#c8c5ba;--signal:#df5c32;--lime:#d8ee67;--panel:#fffdf7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 Arial,sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:3;background:var(--ink);color:white;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}.top h1{font:700 clamp(25px,4vw,42px) Georgia,serif;margin:0}.top a{color:var(--lime)}.layout{display:grid;grid-template-columns:350px minmax(0,1fr);min-height:calc(100vh - 79px)}.sidebar{border-right:1px solid var(--line);padding:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);padding:10px}.stat strong{display:block;font-size:20px}.stat small{color:var(--muted)}.orders{display:grid;gap:8px}.order-card{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);padding:13px;cursor:pointer}.order-card.active{border:2px solid var(--signal)}.order-card strong,.order-card small{display:block}.order-card small{color:var(--muted);margin-top:4px}.tag{display:inline-block;border-radius:99px;padding:3px 8px;font-size:11px;background:#e7e5dd}.tag.approved{background:var(--lime)}.tag.rejected{background:#ffd5cb}.content{padding:24px;min-width:0}.empty{padding:80px 20px;text-align:center;color:var(--muted)}.order-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-bottom:20px}.order-head h2{font:700 clamp(30px,5vw,58px)/1 Georgia,serif;margin:0 0 9px}.order-head p{color:var(--muted);margin:3px 0}.order-controls{display:grid;gap:8px;min-width:230px}.order-controls select,.order-controls textarea,.review input,.review select,.review textarea,.login input{width:100%;border:1px solid var(--line);background:white;padding:9px}.order-controls textarea{min-height:78px;resize:vertical}.item{display:grid;grid-template-columns:120px minmax(260px,1.3fr) minmax(270px,1fr);gap:16px;border-top:1px solid var(--line);padding:18px 0}.item img{width:120px;height:110px;object-fit:cover;background:#ddd}.item h3{font:700 20px/1.15 Georgia,serif;margin:0 0 7px}.item a{color:inherit}.item p{margin:4px 0;color:var(--muted);font-size:13px}.review{display:grid;grid-template-columns:1fr 1fr;gap:8px}.review label{font-size:11px;text-transform:uppercase;color:var(--muted)}.review textarea{grid-column:1/-1;min-height:60px}.total{position:sticky;bottom:0;margin:20px -24px -24px;padding:16px 24px;background:var(--lime);display:flex;gap:28px;justify-content:flex-end;align-items:center;font-weight:bold}.save{border:0;background:var(--ink);color:white;padding:12px 18px;cursor:pointer}.notice{color:var(--signal);min-height:20px}.login{position:fixed;inset:0;z-index:10;background:var(--ink);display:grid;place-items:center;padding:20px}.login form{width:min(420px,100%);background:var(--paper);padding:28px}.login h2{font:700 34px Georgia,serif;margin:0 0 8px}.login p{color:var(--muted)}.login button{width:100%;border:0;background:var(--signal);color:white;padding:12px;margin-top:10px;cursor:pointer}.hidden{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.item{grid-template-columns:90px 1fr}.item img{width:90px;height:84px}.review{grid-column:1/-1}.order-head{grid-template-columns:1fr}.order-controls{min-width:0}.total{justify-content:space-between;flex-wrap:wrap}}
</style>
</head>
<body>
<header class="top"><h1>Заявки закупщика</h1><a href="/">Каталог ↗</a></header>
<main class="layout"><aside class="sidebar"><div id="stats" class="stats"></div><div id="orders" class="orders"></div></aside><section id="content" class="content"><div class="empty">Выберите заявку слева</div></section></main>
<div id="login" class="login"><form id="loginForm"><h2>Вход закупщика</h2><p>Введите пароль админки. Он хранится только до закрытия вкладки.</p><input id="password" type="password" required autocomplete="current-password" aria-label="Пароль" placeholder="Пароль"><button>Войти</button><p id="loginError" class="notice"></p></form></div>
<script>
const rub=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let token=sessionStorage.getItem('buyer-password')||'',orders=[],current=null;
const api=async(path,options={})=>{const response=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...options.headers}});const data=await response.json();if(response.status===401){sessionStorage.removeItem('buyer-password');document.getElementById('login').classList.remove('hidden');throw Error(data.error)}if(!response.ok)throw Error(data.error||'Ошибка сервера');return data};
function statusName(s){return({new:'Новая',review:'В работе',approved:'К закупке',rejected:'Отклонена'})[s]||s}function decisionName(s){return({review:'На проверке',viable:'Выгодно',clarify:'Уточнить',reject:'Не везти'})[s]||s}
async function loadOrders(selectId){const data=await api('/api/admin/orders');orders=data.orders;document.getElementById('stats').innerHTML='<div class="stat"><strong>'+orders.length+'</strong><small>всего</small></div><div class="stat"><strong>'+orders.filter(x=>x.status==='new').length+'</strong><small>новых</small></div><div class="stat"><strong>'+orders.filter(x=>x.status==='approved').length+'</strong><small>к закупке</small></div>';document.getElementById('orders').innerHTML=orders.length?orders.map(o=>'<button class="order-card '+(current?.id===o.id?'active':'')+'" data-id="'+esc(o.id)+'"><span class="tag '+o.status+'">'+statusName(o.status)+'</span><strong>'+esc(o.project)+'</strong><small>'+esc(o.designer)+' · '+new Date(o.created_at).toLocaleString('ru-RU')+'</small><small>'+o.item_count+' поз. · '+rub(o.estimated_total)+'</small></button>').join(''):'<div class="empty">Заявок пока нет</div>';if(selectId)await openOrder(selectId)}
async function openOrder(id){current=await api('/api/admin/orders/'+encodeURIComponent(id));renderOrder();document.querySelectorAll('.order-card').forEach(x=>x.classList.toggle('active',x.dataset.id===id))}
function renderOrder(){const o=current;document.getElementById('content').innerHTML='<div class="order-head"><div><h2>'+esc(o.project)+'</h2><p>Заявка '+esc(o.id)+' · дизайнер '+esc(o.designer)+'</p><p>'+esc(o.note||'Без общего комментария')+'</p></div><div class="order-controls"><select id="status"><option value="new">Новая</option><option value="review">В работе</option><option value="approved">К закупке</option><option value="rejected">Отклонена</option></select><textarea id="buyerNote" placeholder="Общий комментарий закупщика">'+esc(o.buyer_note)+'</textarea><div id="notice" class="notice"></div></div></div><div>'+o.items.map(item=>'<article class="item" data-item="'+item.id+'"><img src="'+esc(item.image)+'" alt=""><div><h3><a href="'+esc(item.url)+'" target="_blank" rel="noopener">'+esc(item.name)+' ↗</a></h3><p>'+esc(item.category)+' · '+esc(item.supplier)+'</p><p>Источник: '+esc(item.source_price)+' · оценка: <b>'+rub(item.estimated_price)+'</b> · количество: <b>'+item.quantity+'</b></p><p>Комментарий дизайнера: '+esc(item.designer_note||'—')+'</p></div><div class="review"><label>Цена товара, ₽<input data-field="actual_price" type="number" min="0" step="1" value="'+(item.actual_price??'')+'"></label><label>Логистика, ₽<input data-field="logistics" type="number" min="0" step="1" value="'+(item.logistics??'')+'"></label><label>Решение<select data-field="decision">'+['review','viable','clarify','reject'].map(v=>'<option value="'+v+'" '+(item.decision===v?'selected':'')+'>'+decisionName(v)+'</option>').join('')+'</select></label><textarea data-field="buyer_note" placeholder="Комментарий закупщика">'+esc(item.buyer_note)+'</textarea></div></article>').join('')+'</div><div class="total"><span>Расчёт дизайнера: <b id="estimated"></b></span><span>Закупка + доставка: <b id="actual"></b></span><button id="save" class="save">Сохранить проверку</button></div>';document.getElementById('status').value=o.status;document.getElementById('save').onclick=save;document.getElementById('content').oninput=totals;totals()}
function itemsPayload(){return [...document.querySelectorAll('[data-item]')].map(row=>({id:Number(row.dataset.item),actual_price:row.querySelector('[data-field=actual_price]').value||null,logistics:row.querySelector('[data-field=logistics]').value||null,decision:row.querySelector('[data-field=decision]').value,buyer_note:row.querySelector('[data-field=buyer_note]').value}))}function totals(){document.getElementById('estimated').textContent=rub(current.items.reduce((s,x)=>s+x.estimated_price*x.quantity,0));const values=itemsPayload();document.getElementById('actual').textContent=rub(values.reduce((s,x,i)=>s+((Number(x.actual_price)||0)+(Number(x.logistics)||0))*current.items[i].quantity,0))}
async function save(){const notice=document.getElementById('notice');notice.textContent='Сохраняю…';try{await api('/api/admin/orders/'+encodeURIComponent(current.id),{method:'PATCH',body:JSON.stringify({status:document.getElementById('status').value,buyer_note:document.getElementById('buyerNote').value,items:itemsPayload()})});notice.textContent='Сохранено ✓';await loadOrders();current=await api('/api/admin/orders/'+encodeURIComponent(current.id))}catch(error){notice.textContent=error.message}}
document.getElementById('orders').onclick=e=>{const button=e.target.closest('[data-id]');if(button)openOrder(button.dataset.id)};document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();token=document.getElementById('password').value;try{await loadOrders();sessionStorage.setItem('buyer-password',token);document.getElementById('login').classList.add('hidden')}catch(error){document.getElementById('loginError').textContent=error.message}};(async()=>{if(!token)return;try{await loadOrders();document.getElementById('login').classList.add('hidden')}catch{}})();
</script>
</body></html>
